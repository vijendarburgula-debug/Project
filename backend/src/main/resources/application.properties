server.port=8080
spring.application.name=postman-helper

# ── AI (Anthropic Claude) ─────────────────────────────────────────────────────
# Paste your key here OR set env var:  ANTHROPIC_API_KEY=sk-ant-...
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ── Admin ──────────────────────────────────────────────────────────────────────
# Only this email can view the login history. Override with env var ADMIN_EMAIL.
app.admin.email=${ADMIN_EMAIL:vijendarburgula@gmail.com}

# Where login records are stored. Defaults to a relative path — most hosts
# (e.g. Render's free web services) wipe this on redeploy, but it survives
# normal sleep/wake restarts. Override with env var LOGINS_CSV_PATH.
app.logins.csv.path=${LOGINS_CSV_PATH:logins.csv}
