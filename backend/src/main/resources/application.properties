server.port=8080
spring.application.name=postman-helper

# No database by default (local dev needs zero setup) — login history falls
# back to a CSV file. Activate the "postgres" profile (SPRING_PROFILES_ACTIVE=
# postgres) in production to store logins in Postgres instead; see
# application-postgres.properties for the datasource config that re-enables.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ── AI (Anthropic Claude) ─────────────────────────────────────────────────────
# Paste your key here OR set env var:  ANTHROPIC_API_KEY=sk-ant-...
anthropic.api.key=${ANTHROPIC_API_KEY:}

# ── Admin ──────────────────────────────────────────────────────────────────────
# Only this email can view the login history. Override with env var ADMIN_EMAIL.
app.admin.email=${ADMIN_EMAIL:vijendarburgula@gmail.com}

# Fallback CSV path when the "postgres" profile isn't active. Defaults to a
# relative path, which most hosts (e.g. Render's free web services) wipe on
# every restart/redeploy — fine for local dev, not for production.
app.logins.csv.path=${LOGINS_CSV_PATH:logins.csv}
