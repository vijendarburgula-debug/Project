# Active only when SPRING_PROFILES_ACTIVE=postgres is set (e.g. on Render).
# Re-enables the DataSource/JPA auto-configuration excluded by default.
spring.autoconfigure.exclude=

# Fill these in from Render's Postgres "Connect" info panel (host/port/database/
# username/password), set as env vars on the backend service — not the database.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
